[project]
name = "imcodex"
version = "0.1.0"
description = "IM to Codex app-server bridge"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.0",
    "im-agent-sdk[appserver,channels]==0.1.0a1",
    "Pillow>=12.3.0,<13.0.0",
    "pydantic>=2.11.0",
    "pycryptodome>=3.23.0,<4.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "python-socks[asyncio]>=2.4.4,<3.0.0",
    "starlette>=0.47.2",
    "uvicorn>=0.34.0",
    "websocket-client>=1.8.0",
    "websockets>=15.0.0,<16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
]
agentkit = [
    "agentkit @ git+https://github.com/albert-zen/AgentKit.git@main",
]
feishu = [
    "lark-channel-sdk>=1.1.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"imcodex.admin" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.imcodex.sdk]
# The v1 acceptance artifact is deliberately recorded separately from the
# package version: the wheel is the installed public surface and the commit
# is the source provenance for that artifact.
canonical_commit = "a72b24a2558c8b2aa48b05214588da4fc1a434db"
wheel = "/Users/xbjt/Code/im-agent-sdk/dist/im_agent_sdk-0.1.0a1-py3-none-any.whl"
wheel_sha256 = "e160c31dd5661c9b419193c9ad3ddb1deb676949fc4a730ed36c65710885572d"
